; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitm-1]
; Pinned to the newer i2c_master API (ESP-IDF 5.2+) that the Phase 2 BH1750 driver needs.
platform = espressif32@6.9.0
; Board id retargeted for the actual hardware: Hosyond ESP32-S3-WROOM-1 N16R8
; (16 MB flash, 8 MB octal PSRAM). PlatformIO's board database has no exact
; "N16R8" entry, so we base off the closest upstream Espressif WROOM-1 devkit
; board (`esp32-s3-devkitc-1`, an N8-flash/no-PSRAM board using the same
; WROOM-1 module family) and override the flash size + partition table below
; to match the real 16 MB part. PSRAM is left disabled in software/Kconfig per
; the spec (a 58 KB ring buffer + small HTTP server do not need 8 MB, and
; leaving octal PSRAM off avoids a class of configuration faults) — no PSRAM
; build flags are added, and the base board's own PSRAM support (none) is
; irrelevant since we never enable it.
board = esp32-s3-devkitc-1
framework = espidf
; Declare the true 16 MB flash to the build/upload tooling (base board is 8 MB).
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
; Custom partition table sized for 16 MB flash (single factory app, no OTA).
board_build.partitions = partitions.csv
; Match the firmware's console baud. Without this, PlatformIO's monitor
; defaults to 9600 while the IDF console runs at 115200
; (CONFIG_ESP_CONSOLE_UART_BAUDRATE, visible in
; sdkconfig.esp32-s3-devkitm-1), and `pio device monitor` renders every boot
; log as byte garbage at exactly 12x undersampling. This is a monitor-only
; setting — it does not reach the firmware — but it is the difference between
; a readable bench bring-up and an unreadable one, and the whole Phase 1-6
; hardware-verification punch list depends on reading those boot logs.
monitor_speed = 115200
; Symbolize panic backtraces at monitor time. systemPatterns.md § Known
; Deviations D6 records that no coredump partition is configured
; (CONFIG_ESP_COREDUMP_ENABLE_TO_NONE=y), so a crash leaves no post-mortem
; artifact on the device — this filter recovers file:line from the backtrace
; while the monitor is attached, which is the only forensic channel there is
; during bench work. Purely host-side; drop it freely if it gets noisy.
monitor_filters = esp32_exception_decoder
; Phase 6 dashboard assets (src/web/*), embedded into the firmware image as
; null-terminated byte arrays reachable from src/http_api.c as
; `_binary_<basename>_start`/`_end`. Neither of PlatformIO's two documented
; embed mechanisms (idf_component_register's EMBED_TXTFILES, and
; board_build.embed_txtfiles) actually link the generated data into the
; final firmware.elf under this platform version — see
; embed_web_assets.py's module docstring for the investigation — so this
; extra_script reimplements the missing link step directly.
extra_scripts = embed_web_assets.py
; As of Phase 3, src/main.c and src/sampler.c actually #include every one of
; these modules' headers (main.c: bh1750/ds18b20_probe/device_status/
; reading_store/sampler; sampler.c: bh1750/ds18b20_probe/level_switches/
; sensor_hub/reading_store), so PlatformIO's chain-mode Library Dependency
; Finder would now resolve all of them on its own. They are still listed
; explicitly here as belt-and-suspenders: this is exactly the mechanism that
; silently dropped Phase 2's modules from the firmware image until the
; Phase 2 remediation (see memory-bank/tasks/sensor-monitoring-dashboard.md
; Execution State) added them to app_main() — keeping them declared here too
; means a future accidental un-wiring from src/ fails loudly (a missing
; header, not a silently-smaller firmware image) rather than repeating that
; defect.
lib_deps =
    bh1750
    ds18b20_probe
    device_status
    level_switches
    sensor_hub
    reading_store
    wifi_backoff
    reading_json
    status_led

; `src/wifi_conn.c` guards its Wi-Fi secrets include with
; `#if !__has_include("wifi_secrets.h")` / `#error` (AC-ERROR-6), so a fresh
; clone without `include/wifi_secrets.h` fails the *real* build loudly. Under
; `pio check`'s cppcheck invocation specifically, this is a verified false
; positive: cppcheck is given the correct `include/` search path (confirmed
; by inspecting its actual `-I`/`--includes-file` arguments), but once every
; GCC/xtensa built-in macro is supplied as an explicit `-D` (which disables
; cppcheck's usual multi-configuration #ifdef exploration and forces a single
; fixed configuration), its own `__has_include` evaluation still fails to
; resolve the file and reports the `#error` text itself as a
; `preprocessorErrorDirective` finding — reproduced by replaying the captured
; cppcheck invocation with only the `-D` flags stripped, which then resolves
; the header correctly. The real `pio run` build always finds the file (it
; must, or the actual build fails) and is unaffected; only cppcheck's
; standalone preprocessor mis-resolves it under this flag combination. A
; normal `// cppcheck-suppress` inline comment does not apply here (this is a
; preprocessor-stage message, evaluated before cppcheck's per-line inline
; suppression pass), so the suppression is scoped here instead, to this one
; file and this one finding ID — not a blanket suppression — so a genuine
; future preprocessorErrorDirective elsewhere is still reported.
check_flags =
    cppcheck: --suppress=preprocessorErrorDirective:*/wifi_conn.c

; Host-runnable test environment: compiles ONLY the pure, host-testable logic
; modules (currently `reading_store_core`, `level_switches`, `sensor_hub`)
; against a lightweight ESP-IDF type shim, with no FreeRTOS and no ESP-IDF
; framework at all. This is what makes `pio test -e native` runnable without
; a physically-attached board.
[env:native]
platform = native
build_flags =
    -std=c11
    -I test/native
; `test/native/stubs/` holds the link-time substitutes for sensor_hub's three
; per-sensor read seams (bh1750_stub.c, ds18b20_probe_stub.c,
; level_switches_stub.c) plus their shared control header
; (sensor_hub_stubs.h). It is a flat directory of loose .c/.h files directly
; under `lib_extra_dirs`'s parent (test/native), so PlatformIO's Library
; Dependency Finder treats it as one library named "stubs" and only pulls it
; in for test_sensor_hub (the only suite that #includes sensor_hub_stubs.h) —
; test_reading_store and test_level_switches are unaffected.
lib_extra_dirs = test/native
; Never compile src/ (app_main + device-only FreeRTOS/ESP-IDF wiring) into the
; native test binary — only the host-testable units: the pure ring buffer
; library and the pure level-switches debounce state machine (both
; auto-resolved by the Library Dependency Finder via the #include in each
; test file), sensor_hub against its stubbed driver seams, the test suites
; themselves, and the native shim/support headers under test/native.
test_build_src = no
test_filter = test_reading_store, test_level_switches, test_sensor_hub, test_wifi_backoff, test_reading_json, test_status_led_core, test_device_status
